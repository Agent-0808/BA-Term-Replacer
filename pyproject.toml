[project]
name = "batr"
version = "0.1.0"
description = "BA-Term-Replacer：蔚蓝档案国际服（GL）译名替换 / 繁简转换工具"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    # 唯一的运行时依赖：带 SQLCipher 的 sqlite3 绑定（有预编译 wheel，无需编译器）
    "sqlcipher3-wheels>=0.5.0",
]

[project.scripts]
batr = "batr.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batr"]
